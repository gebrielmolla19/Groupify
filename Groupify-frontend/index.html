<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set the theme class before first paint (#60). next-themes only does
         this itself with server rendering; in this client-only app the light
         tokens would paint until React mounts. Mirrors the ThemeProvider in
         App.tsx: key "groupify-theme", default "dark", "system" follows the
         device. Keep the two in sync. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("groupify-theme") || "dark";
        } catch (e) {
          // Storage blocked (private mode, site data off): use the default.
        }
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme !== "light") theme = "dark";
        var root = document.documentElement;
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#090a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groupify" />
    <meta name="description" content="Share music with your group" />

    <!-- Fonts: Bricolage Grotesque (display), Inter (text), JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    />

    <title>Groupify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
